[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xgb_wav"
version = "1.0.0"
description = "工业音频坏件检测：XGB + wav2vec2 融合（GUI / CLI / 可离线部署）"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "mmr0817" }]
keywords = ["audio", "anomaly-detection", "xgboost", "wav2vec2", "fault-detection"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "xgboost==3.4.1",
    "librosa>=0.10",
    "soundfile>=0.12",
    "joblib>=1.3",
    "pandas>=2.0",
    "torch>=2.0",
    "torchaudio>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
train = ["tqdm>=4.65"]
dev = ["pytest>=7", "pyinstaller>=6.0"]

[project.scripts]
xgb-wav-gui = "xgb_wav.gui:main"
xgb-wav = "xgb_wav.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
