services:
  xgb_wav:
    build:
      context: .
      dockerfile: Dockerfile
    image: xgb_wav:1.0
    volumes:
      - ./data:/data        # 放待检测 wav 的目录（Windows 下就是 .\data）
      - ./outputs:/out      # 结果 CSV 会出现在宿主机的 .\outputs
    # 默认：把 /data 下所有 wav 跑一遍，报表写到 /out
    command: ["--input", "/data", "--out-dir", "/out"]
    # 想带标签评测就改成（需要 ./data 里有 good/ 与 bad/ 两个子目录）：
    # command: ["--data", "/data", "--holdout", "--out-dir", "/out"]
