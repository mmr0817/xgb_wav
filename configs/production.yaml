# xgb_wav 生产配置（说明用；实际推理读取 models/detector.json 与 models/fusion.json）
#
# 这份文件记录训练与推理的关键参数，便于复现与审计。

data:
  raw_dir: data/raw                 # 训练数据：good/ bad/ 子目录
  sample_rate: 16000                # wav2vec2 分支
  max_duration: 2.5

features:                            # XGB 分支（44.1 kHz 原始采样率）
  sample_rate: 44100
  n_mfcc: 13
  n_fft: 2048
  hop_length: 512
  fmin: 100.0
  fmax: 10000.0
  n_harmonics: 5
  align: true
  extra_bands: []                    # 可选的额外窄带特征（如 5k/11k），默认关闭

xgb:
  n_estimators: 800
  max_depth: 4
  learning_rate: 0.05

wav2vec:
  backbone: WAV2VEC2_BASE
  hidden_size: 256
  dropout: 0.1
  lr: 1.0e-4
  epochs: 60
  batch_size: 128

fusion:
  type: mean_standardized_logit
  margin: 0.2                        # 宁杀勿漏：阈值再减 0.2
  target_recall: 0.995

training:
  oof_folds: 3
  oof_epochs: 35
  seed: 42
