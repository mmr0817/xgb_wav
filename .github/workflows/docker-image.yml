name: docker-image

# 在 GitHub 上构建 linux/amd64 + linux/arm64 双架构镜像并推到 GHCR。
# 这样 Apple Silicon 的 Windows(ARM64) 与普通 x64 都能直接 docker pull 运行，
# 无需本地安装 Python / 也不需要能访问 PyTorch 下载源。
#
# 前置：Release 里有 w2v_ckpt.pt（361 MB）。若还没有，本工作流会失败并提示。

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch w2v_ckpt.pt from release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f models/w2v_ckpt.pt ]; then
            gh release download --pattern w2v_ckpt.pt --dir models --clobber || true
          fi
          if [ ! -f models/w2v_ckpt.pt ]; then
            echo "::error::models/w2v_ckpt.pt not found. Upload it as a Release asset first (Releases -> Draft a new release)."
            exit 1
          fi
          ls -lh models/

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
