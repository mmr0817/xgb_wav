name: build-windows-exe

# 在 GitHub 的 windows-latest（x64）上打包 exe，无需你本地有 Windows 机器。
# 触发：手动 Actions -> Run workflow，或推送 v* 标签。
#
# 前置：仓库 Release 里已有 assets: w2v_ckpt.pt（361 MB，git 里太大放不下）
#   上传方式：Releases -> Draft a new release -> 拖入 models/w2v_ckpt.pt -> Publish

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install -U pip
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt pyinstaller

      - name: Fetch w2v_ckpt.pt from release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (-not (Test-Path models/w2v_ckpt.pt)) {
            gh release download --pattern w2v_ckpt.pt --dir models --clobber
          }
          if (-not (Test-Path models/w2v_ckpt.pt)) {
            Write-Error "models/w2v_ckpt.pt missing: upload it as a release asset first"
            exit 1
          }
          Get-ChildItem models | Select-Object Name, Length

      - name: Self-test (CLI on ref_sweep.wav)
        env:
          PYTHONPATH: src
        run: python -m xgb_wav.cli --models models --input models/ref_sweep.wav --output selftest.csv

      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean scripts/xgb_wav.spec

      - name: Copy models next to exe
        run: Copy-Item -Recurse -Force models dist/xgb_wav/models

      - name: Package
        run: Compress-Archive -Path dist/xgb_wav/* -DestinationPath xgb_wav-windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: xgb_wav-windows-x64
          path: xgb_wav-windows-x64.zip
          retention-days: 30

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${env:GITHUB_REF_NAME}" xgb_wav-windows-x64.zip --clobber
